<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 258" width="840" height="258" role="img" aria-label="Terminal: whoami prints Alexey Dalekin, co-founder and solution architect at Utopy AI">
  <style>
    .win { fill: #f6f8fa; stroke: #d0d7de; }
    .bar { fill: #eaeef2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; }
    .prompt { fill: #1a7f37; }
    .cmd { fill: #1f2328; }
    .out { fill: #57606a; }
    .name { fill: #0969da; font-size: 30px; font-weight: 700; }
    .cursor { fill: #1f2328; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <clipPath id="clip"><rect x="1" y="1" width="838" height="256" rx="10" /></clipPath>
  <rect class="win" x="1" y="1" width="838" height="256" rx="10" />
  <rect class="bar" x="1" y="1" width="838" height="34" clip-path="url(#clip)" />
  <circle cx="24" cy="18" r="6" fill="#ff5f57" />
  <circle cx="44" cy="18" r="6" fill="#febc2e" />
  <circle cx="64" cy="18" r="6" fill="#28c840" />
  <g class="mono">
    <text x="28" y="68"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text class="name" x="28" y="106">Alexey Dalekin</text>
    <text x="28" y="144"><tspan class="prompt">$ </tspan><tspan class="cmd">cat ~/now.txt</tspan></text>
    <text class="out" x="28" y="172">Co-founder &amp; Solution Architect at Utopy AI</text>
    <text class="out" x="28" y="198">Python · distributed systems · event-driven architecture</text>
    <text x="28" y="232"><tspan class="prompt">$ </tspan></text>
    <rect class="cursor" x="48" y="218" width="9" height="18" />
  </g>
</svg>
